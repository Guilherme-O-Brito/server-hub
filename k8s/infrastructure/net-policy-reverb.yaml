apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reverb-network-policy
  namespace: server-hub
spec:
  podSelector:
    matchLabels:
      app: reverb

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik

        - podSelector:
            matchLabels:
              app: laravel

        - podSelector:
            matchLabels:
              app: laravel-worker

      ports:
        - protocol: TCP
          port: 8080