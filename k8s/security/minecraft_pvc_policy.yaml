apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy

metadata:
  name: server-hub-minecraft-pvc

spec:
  failurePolicy: Fail

  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - persistentvolumeclaims

  validations:

    - expression: >
        object.spec.storageClassName == 'local-path'
      message: "Only the local-path StorageClass is allowed in games."

    - expression: >
        object.spec.accessModes.size() == 1 &&
        object.spec.accessModes[0] == 'ReadWriteOnce'
      message: "Minecraft PVCs must use ReadWriteOnce."

    - expression: >
        !has(object.spec.volumeMode) ||
        object.spec.volumeMode == 'Filesystem'
      message: "Minecraft PVCs must use Filesystem volume mode."

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding

metadata:
  name: server-hub-minecraft-pvc-games

spec:
  policyName: server-hub-minecraft-pvc

  validationActions:
    - Deny
    - Audit

  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: games