name: Build and push image

on:
  push:
    tags:
      - "v*"


permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Login to ghcr
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Build image
        run: |
          docker build . \
            --tag ghcr.io/guilherme-o-brito/server-hub:${VERSION} \
            --tag ghcr.io/guilherme-o-brito/server-hub:latest
      - name: Push image to ghcr
        run: |  
          docker push ghcr.io/guilherme-o-brito/server-hub:${VERSION}
          docker push ghcr.io/guilherme-o-brito/server-hub:latest
      
      - name: Save image
        run: |
          docker save ghcr.io/guilherme-o-brito/server-hub:${VERSION} | gzip > server-hub-${VERSION}.tar.gz

      - name: Package K3s declaratives
        run: |
          tar -czf k3s-declaratives-${VERSION}.tar.gz k8s/
      
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Server-Hub ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            server-hub-${{ env.VERSION }}.tar.gz
            k3s-declaratives-${{ env.VERSION }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
